<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pegfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0c0618;overflow:hidden;font-family:"Fredoka",system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative}
  canvas#c{display:block;cursor:default}
  .lil{font-family:"Lilita One","Fredoka",sans-serif;font-weight:400;letter-spacing:.03em}
  #ui{position:absolute;top:1.97%;right:3.636%;display:flex;gap:.4em;z-index:5}
  #ui button{font-family:"Fredoka",sans-serif;font-weight:700;font-size:.8em;background:linear-gradient(180deg,#eef3ff,#b7c6ea 45%,#7083b6);border:2px solid #1b2346;color:#1f2a55;text-shadow:0 1px 0 rgba(255,255,255,.7);border-radius:.6em;padding:.35em .75em;cursor:pointer;box-shadow:0 .15em 0 #1b2346,inset 0 1px 0 #fff}
  #ui button:hover{filter:brightness(1.2)}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(30,12,60,.55),rgba(6,3,16,.85));z-index:3}
  #overlay.hidden{display:none}
  .card{position:relative;background:linear-gradient(170deg,#3a2470,#1a0f36 70%);border:.22em solid #d4a64a;outline:.12em solid rgba(255,255,255,.15);outline-offset:-.5em;border-radius:1.4em;padding:1.6em 1.9em;text-align:center;width:min(86%,44em);max-height:90%;overflow:auto;box-shadow:0 1.2em 3em rgba(0,0,0,.6),inset 0 0 2em rgba(0,0,0,.35)}

  .logo{font-family:"Lilita One",sans-serif;font-size:5.2em;line-height:1;margin:.05em 0 .05em;background:linear-gradient(180deg,#fff6c9 0%,#fbbf24 45%,#ea580c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .06em 0 #5b1d0a) drop-shadow(0 .12em .12em rgba(0,0,0,.5));letter-spacing:.04em}

  h2{font-family:"Lilita One",sans-serif;font-weight:400;font-size:2.3em;margin:.1em 0 .25em;color:#fde68a;text-shadow:0 .08em 0 #5b1d0a;letter-spacing:.03em}
  p{margin:.45em 0;color:#ddd6fe;font-size:1em;line-height:1.4}
  .big{font-family:"Lilita One",sans-serif;font-size:1.9em;color:#fff;letter-spacing:.03em}
  .btn{font-family:"Lilita One",sans-serif;font-size:1.25em;letter-spacing:.04em;margin:.7em .3em 0;background:linear-gradient(180deg,#fdba74,#f97316 45%,#c2410c);border:.12em solid #ffe8a3;color:#fff;border-radius:.8em;padding:.45em 1.2em;cursor:pointer;box-shadow:0 .22em 0 #7c2d12,0 .4em .8em rgba(0,0,0,.4);text-shadow:0 .08em 0 rgba(0,0,0,.35)}
  .btn:hover{filter:brightness(1.1)} .btn:active{transform:translateY(.12em);box-shadow:0 .1em 0 #7c2d12}
  .btn.blue{background:linear-gradient(180deg,#93c5fd,#3b82f6 45%,#1d4ed8);box-shadow:0 .22em 0 #1e3a8a,0 .4em .8em rgba(0,0,0,.4)}
  .btn.purple{background:linear-gradient(180deg,#d8b4fe,#a855f7 45%,#7e22ce);box-shadow:0 .22em 0 #4c1d95,0 .4em .8em rgba(0,0,0,.4)}
  .btn.green{background:linear-gradient(180deg,#86efac,#22c55e 45%,#15803d);box-shadow:0 .22em 0 #14532d,0 .4em .8em rgba(0,0,0,.4)}
  .btn.grey{background:linear-gradient(180deg,#a5b4fc,#6366f1 45%,#4338ca);box-shadow:0 .22em 0 #312e81,0 .4em .8em rgba(0,0,0,.4);font-size:1.05em}
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:.2em .6em;margin:.4em auto 0;max-width:30em}
  .menu .btn{font-size:1.55em;padding:.55em .4em;margin:.35em 0;display:flex;flex-direction:column;align-items:center;line-height:1.05}
  .menu .btn small{font-family:"Fredoka",sans-serif;font-weight:600;font-size:.48em;opacity:.95;margin-top:.2em;letter-spacing:0}
  .parade{display:flex;justify-content:center;gap:.2em;margin:.2em 0 .3em}
  .parade canvas{width:6.2em;height:6.2em}
  .foot{font-size:.9em;color:#a78bfa;margin-top:.8em}
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:.55em;margin:.6em 0}
  .tile{position:relative;background:linear-gradient(180deg,#4a2d86,#24154a);border:.14em solid #d4a64a;border-radius:.9em;color:#fff;cursor:pointer;padding:.3em .2em .5em;font-family:"Fredoka",sans-serif;display:flex;flex-direction:column;align-items:center}
  .tile canvas{width:4.6em;height:4.6em}
  .tile b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:1.4em;line-height:1}
  .tile span{font-size:.72em;color:#ddd6fe}
  .tile.locked{filter:grayscale(1) brightness(.55);cursor:not-allowed}
  .tile.locked::after{content:"🔒";position:absolute;top:.3em;right:.35em;font-size:1em}
  .tile.done::after{content:"★";position:absolute;top:.15em;right:.35em;color:#fde047;font-size:1.2em}
  .picks{display:flex;justify-content:center;flex-wrap:wrap;gap:.4em;margin:.35em 0}
  .pick{background:rgba(255,255,255,.06);border:.13em solid rgba(255,255,255,.18);border-radius:.9em;color:#fff;cursor:pointer;padding:.25em .35em .4em;font-family:"Fredoka",sans-serif;font-weight:600;font-size:.9em;display:flex;flex-direction:column;align-items:center;min-width:5em}
  .pick canvas{width:4.4em;height:4.4em}
  .pick.sel{background:linear-gradient(180deg,rgba(250,204,21,.35),rgba(234,88,12,.25));border-color:#fde047;box-shadow:0 0 .8em rgba(253,224,71,.45)}
  .pick.map{min-width:6.5em;padding:.6em .5em}
  .lbl{font-family:"Lilita One",sans-serif;color:#fde68a;font-size:1.15em;margin-top:.7em;letter-spacing:.03em}
  .rows{display:flex;flex-direction:column;gap:.5em;margin:.6em 0}
  .row{display:flex;align-items:center;gap:.8em;text-align:left;background:linear-gradient(180deg,#4a2d86,#24154a);border:.14em solid #d4a64a;border-radius:1em;color:#fff;cursor:pointer;padding:.35em .9em .35em .4em;font-family:"Fredoka",sans-serif}
  .row canvas{width:4.4em;height:4.4em;flex:none}
  .row b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:1.3em;letter-spacing:.03em}
  .row span{font-size:.9em;color:#ddd6fe}
  .row .ok{margin-left:auto;font-size:1.6em;color:#fde047}
  .row:hover,.tile:not(.locked):hover,.pick:hover{filter:brightness(1.15)}
  .hero{width:9em;height:9em;display:block;margin:-.3em auto -.2em}
  .duo{display:flex;justify-content:center;gap:2em;align-items:flex-end}
  .duo div{display:flex;flex-direction:column;align-items:center}
  .duo canvas{width:8em;height:8em}
  .quote{background:#fff;color:#2a1538;border-radius:1em;padding:.6em 1em;margin:.3em auto .5em;max-width:28em;font-weight:600;position:relative}
  .quote::before{content:"";position:absolute;top:-.6em;left:50%;margin-left:-.6em;border:.6em solid transparent;border-top:0;border-bottom-color:#fff}
  #overlay.menu-mode{background:radial-gradient(ellipse at 50% 55%,rgba(6,9,23,.25),rgba(6,9,23,.72));align-items:center;box-sizing:border-box;pointer-events:none}
  #overlay.menu-mode .card{pointer-events:auto;width:min(52%,27em);background:none;border:0;outline:0;box-shadow:none;padding:0;overflow:visible;max-height:none}
  #overlay.menu-mode .logo{font-size:6em;margin:0 0 -.05em;-webkit-text-stroke:.025em #3a1600;transform:rotate(-3deg);animation:logoBob 3s ease-in-out infinite}
  @keyframes logoBob{50%{transform:rotate(-3deg) translateY(-.06em) scale(1.02)}}
  /* ---- animated title screen ---- */
  #overlay.menu-mode .logo.anim{animation:none;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:inherit;filter:none;-webkit-text-stroke:0;white-space:nowrap;position:relative}
  .logo.anim .l{display:inline-block;animation:letterIn .8s cubic-bezier(.25,1.7,.45,1) both;animation-delay:calc(var(--i) * .075s)}
  .logo.anim .l b{display:inline-block;font-weight:400;background:linear-gradient(180deg,#fff6c9 0%,#fbbf24 45%,#ea580c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.025em #3a1600;
    filter:drop-shadow(0 .06em 0 #5b1d0a) drop-shadow(0 .12em .12em rgba(0,0,0,.5));
    animation:letterBob 2.6s ease-in-out infinite, letterShine 3.6s ease-in-out infinite;animation-delay:calc(1s + var(--i) * .13s), calc(1.2s + var(--i) * .09s)}
  @keyframes letterIn{0%{transform:translateY(-1.3em) scale(.3) rotate(-25deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
  @keyframes letterBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-.08em) rotate(var(--r))}}
  @keyframes letterShine{0%,78%,100%{filter:drop-shadow(0 .06em 0 #5b1d0a) drop-shadow(0 .12em .12em rgba(0,0,0,.5))}86%{filter:brightness(1.55) drop-shadow(0 .06em 0 #5b1d0a) drop-shadow(0 0 .15em rgba(255,240,180,.9))}}
  .logo.anim .spark{position:absolute;font-style:normal;font-size:.28em;color:#fff7d6;text-shadow:0 0 .4em #fde047;pointer-events:none;opacity:0;animation:twinkle 2.2s ease-in-out infinite;animation-delay:calc(1s + var(--d))}
  @keyframes twinkle{0%,100%{transform:scale(0) rotate(0);opacity:0}45%{transform:scale(1.2) rotate(80deg);opacity:1}60%{transform:scale(.9) rotate(100deg);opacity:.9}}
  #overlay.menu-mode .parade canvas{animation:palIn .55s cubic-bezier(.3,1.7,.5,1) both, palHop 3.4s ease-in-out infinite;animation-delay:calc(.55s + var(--i) * .06s), calc(1.8s + var(--i) * .25s)}
  @keyframes palIn{0%{transform:translateY(1em) scale(0);opacity:0}100%{transform:none;opacity:1}}
  @keyframes palHop{0%,72%,100%{transform:translateY(0) scale(1)}80%{transform:translateY(-.55em) scale(1.04,.98)}88%{transform:translateY(0) scale(1.08,.9)}94%{transform:scale(.97,1.04)}}
  #overlay.menu-mode .tablet{animation:tabletIn .65s cubic-bezier(.2,1.35,.4,1) .35s both}
  @keyframes tabletIn{0%{transform:translateY(2em) scale(.92);opacity:0}100%{transform:none;opacity:1}}
  #overlay.menu-mode .menu .btn{animation:btnInL .55s cubic-bezier(.2,1.5,.4,1) both}
  #overlay.menu-mode .menu .btn:nth-child(even){animation-name:btnInR}
  #overlay.menu-mode .menu .btn:nth-child(1){animation-delay:.55s} #overlay.menu-mode .menu .btn:nth-child(2){animation-delay:.63s}
  #overlay.menu-mode .menu .btn:nth-child(3){animation-delay:.71s} #overlay.menu-mode .menu .btn:nth-child(4){animation-delay:.79s}
  #overlay.menu-mode .menu .btn[data-primary]{animation:btnInL .55s cubic-bezier(.2,1.5,.4,1) .55s both, btnGlow 2.4s ease-in-out 1.6s infinite}
  @keyframes btnInL{0%{transform:translateX(-2.5em) scale(.9);opacity:0}100%{transform:none;opacity:1}}
  @keyframes btnInR{0%{transform:translateX(2.5em) scale(.9);opacity:0}100%{transform:none;opacity:1}}
  @keyframes btnGlow{0%,100%{box-shadow:0 .14em 0 #1b2346,0 .3em .5em rgba(0,0,0,.35),inset 0 .08em 0 rgba(255,255,255,.55)}50%{box-shadow:0 .14em 0 #1b2346,0 0 1.1em rgba(253,186,116,.85),inset 0 .08em 0 rgba(255,255,255,.55)}}
  #overlay.menu-mode .menu .btn:hover{transform:scale(1.03)}
  #overlay.menu-mode .minor,#overlay.menu-mode .foot{animation:fadeUp .5s ease-out 1s both}
  @keyframes fadeUp{0%{transform:translateY(.6em);opacity:0}100%{transform:none;opacity:1}}
  @media (prefers-reduced-motion: reduce){#overlay.menu-mode *{animation:none!important}}
  #overlay.menu-mode .parade{gap:0;margin:0 0 -1.1em;position:relative;z-index:1}
  #overlay.menu-mode .parade canvas{width:3.6em;height:3.6em;margin:0 -.4em}
  #overlay.menu-mode .card{width:min(56%,30em)}
  .tablet{position:relative;background:linear-gradient(90deg,#33406c 0%,#7083b6 8%,#bccbec 30%,#e4ebfb 50%,#9cafd9 72%,#52639a 92%,#26305a 100%);border:.14em solid #1b2346;border-radius:1em;padding:1.5em 1.4em 1em;box-shadow:0 .8em 2em rgba(0,0,0,.65),inset 0 .12em 0 rgba(255,255,255,.75),inset 0 -.2em .4em rgba(10,16,48,.45)}
  .tablet::before,.tablet::after{content:"";position:absolute;top:.55em;width:.5em;height:.5em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#b7c5e8 40%,#2e3a66);box-shadow:0 0 0 .07em #1b2346}
  .tablet::before{left:.6em} .tablet::after{right:.6em}
  #overlay.menu-mode .menu{display:flex;flex-direction:column;gap:.5em;max-width:none;margin:0}
  #overlay.menu-mode .menu .btn{font-size:1.75em;margin:0;padding:.42em .4em .38em;border:.09em solid #eef3ff;border-radius:.6em;box-shadow:0 .14em 0 #1b2346,0 .3em .5em rgba(0,0,0,.35),inset 0 .08em 0 rgba(255,255,255,.55)}
  #overlay.menu-mode .menu .btn small{font-size:.42em}
  .minor{display:flex;justify-content:center;gap:.6em;margin-top:.8em}
  .btn.stone{font-size:1em;margin:0;padding:.35em 1.1em;background:linear-gradient(180deg,#eef3ff,#b7c6ea 45%,#7083b6);color:#1f2a55;text-shadow:0 .06em 0 rgba(255,255,255,.7);border:.1em solid #1b2346;box-shadow:0 .14em 0 #1b2346,inset 0 .06em 0 #fff}
  #overlay.menu-mode .foot{color:#c3d0ef;text-shadow:0 .08em .2em #000;margin-top:.7em}
  #overlay.menu-mode .foot b{color:#fff6c2}
  .trophy{width:11em;height:11em;display:block;margin:-.6em auto -.6em}
  .cert{width:100%;border-radius:.5em;box-shadow:0 .4em 1.2em rgba(0,0,0,.5);display:block;margin:.6em auto .2em}
  input.name{font-family:"Lilita One",sans-serif;font-size:1.3em;padding:.3em .6em;border-radius:.6em;border:.12em solid #d4a64a;background:#120828;color:#fde68a;text-align:center;width:14em;outline:none}
  .champ{font-size:1.05em!important;margin-top:.6em!important;background:linear-gradient(180deg,#fef3c7,#facc15 45%,#b45309)!important;color:#5b2d14!important;text-shadow:none!important;box-shadow:0 .22em 0 #78350f!important}
  #ui button.on{background:linear-gradient(180deg,#ffe8a0,#ffb020 50%,#d66a00);color:#3a1600;text-shadow:none}
  .audio{position:relative;background:linear-gradient(90deg,#33406c 0%,#7083b6 8%,#bccbec 30%,#e4ebfb 50%,#9cafd9 72%,#52639a 92%,#26305a 100%);border:.12em solid #1b2346;border-radius:.9em;padding:.8em 1.1em .7em;margin:.7em auto;max-width:30em;box-shadow:0 .4em 1em rgba(0,0,0,.5),inset 0 .1em 0 rgba(255,255,255,.75),inset 0 -.15em .3em rgba(10,16,48,.4)}
  .audio::before,.audio::after{content:"";position:absolute;top:.5em;width:.45em;height:.45em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#b7c5e8 40%,#2e3a66);box-shadow:0 0 0 .07em #1b2346}
  .audio::before{left:.55em} .audio::after{right:.55em}
  .audio .lbl{color:#1f2a55;text-shadow:0 .07em 0 rgba(255,255,255,.7)}
  .arow{display:flex;align-items:center;gap:.7em;margin:.5em 0}
  .aname{flex:none;display:flex;flex-direction:column;align-items:center;font-family:"Lilita One",sans-serif;font-size:1.05em;line-height:1.1;width:7.5em;text-align:center;color:#1f2a55;text-shadow:0 .07em 0 rgba(255,255,255,.7)}
  .aname i{font-style:normal;font-size:1.25em;line-height:1.1;text-shadow:none}
  .arow input[type=range]{--v:50%;flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:1.5em;background:transparent;cursor:pointer;margin:0}
  .arow input[type=range]::-webkit-slider-runnable-track{height:.7em;border-radius:.35em;border:.08em solid #1b2346;box-shadow:0 .08em 0 rgba(255,255,255,.6),inset 0 .15em .25em rgba(0,0,0,.7);
    background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 50%) 0 0/var(--v) 100% no-repeat,linear-gradient(90deg,#d63a00,#ff9f1a,#ffe14d) 0 0/var(--v) 100% no-repeat,linear-gradient(180deg,#03050f,#141d45)}
  .arow input[type=range]::-moz-range-track{height:.7em;border-radius:.35em;border:.08em solid #1b2346;background:linear-gradient(180deg,#03050f,#141d45);box-shadow:inset 0 .15em .25em rgba(0,0,0,.7)}
  .arow input[type=range]::-moz-range-progress{height:.7em;border-radius:.35em;background:linear-gradient(90deg,#d63a00,#ff9f1a,#ffe14d)}
  .arow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.35em;height:1.35em;margin-top:-.4em;border-radius:50%;border:.1em solid #1b2346;background:radial-gradient(circle at 35% 30%,#fff 0%,#dfe7fa 30%,#8c9fcd 70%,#3a4874 100%);box-shadow:0 .12em .25em rgba(0,0,0,.5)}
  .arow input[type=range]::-moz-range-thumb{width:1.2em;height:1.2em;border-radius:50%;border:.1em solid #1b2346;background:radial-gradient(circle at 35% 30%,#fff 0%,#dfe7fa 30%,#8c9fcd 70%,#3a4874 100%);box-shadow:0 .12em .25em rgba(0,0,0,.5)}
  .arow input[type=range]:hover::-webkit-slider-thumb{filter:brightness(1.1)}
  .aval{flex:none;width:3.6em;box-sizing:border-box;white-space:nowrap;text-align:center;font-family:"Lilita One",sans-serif;color:#fff6c2;background:linear-gradient(180deg,#03050f,#141d45);border:.08em solid #1b2346;border-radius:.5em;padding:.12em 0;box-shadow:0 .08em 0 rgba(255,255,255,.6);text-shadow:0 0 .4em #ffb020}
  .mute{font-family:"Fredoka",sans-serif;font-weight:700;font-size:.85em;background:linear-gradient(180deg,#eef3ff,#b7c6ea 45%,#7083b6);border:.1em solid #1b2346;color:#1f2a55;text-shadow:0 .06em 0 rgba(255,255,255,.7);border-radius:.6em;padding:.3em 0;cursor:pointer;flex:none;width:6.6em;white-space:nowrap;box-shadow:0 .12em 0 #1b2346,inset 0 .06em 0 #fff}
  .mute:active{transform:translateY(.08em);box-shadow:0 .04em 0 #1b2346}
  .mute.on{background:linear-gradient(180deg,#ffe8a0,#ffb020 50%,#d66a00);color:#3a1600;text-shadow:none}
  #pause{position:absolute;z-index:5;left:4.091%;bottom:4.296%;width:5.455%;aspect-ratio:1;border-radius:50%;cursor:pointer;padding:0;
    background:radial-gradient(circle at 35% 30%,#dbeaff 0%,#4f8cff 32%,#1d3fa8 70%,#0b1a55 100%);
    border:.22em solid #c3d0ef;box-shadow:0 .25em .5em rgba(0,0,0,.55),inset 0 -.25em .4em rgba(0,0,0,.35),0 0 0 .12em #1b2346;
    display:flex;align-items:center;justify-content:center;gap:16%;transition:transform .1s,filter .1s}
  #pause span{display:block;width:13%;height:38%;background:#fff;border-radius:.15em;box-shadow:0 .08em 0 rgba(42,21,56,.6)}
  #pause::after{content:"";position:absolute;left:18%;top:10%;width:38%;height:22%;border-radius:50%;background:rgba(255,255,255,.45);transform:rotate(-25deg)}
  #pause:hover{filter:brightness(1.15);transform:scale(1.06)} #pause:active{transform:scale(.95)}
  .stages{display:flex;flex-direction:column;gap:.45em;margin:.5em 0;text-align:left}
  .stage{display:flex;align-items:center;gap:.6em;background:rgba(10,5,24,.35);border:.1em solid rgba(212,166,74,.45);border-radius:.9em;padding:.3em .5em}
  .stage.shut{filter:grayscale(.8) brightness(.6)}
  .stage .who{display:flex;align-items:center;gap:.4em;width:12.5em;flex:none}
  .stage .who canvas{width:3.4em;height:3.4em;flex:none}
  .stage .who b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:1.05em;color:#fde68a;display:block;line-height:1.1}
  .stage .who span{font-size:.78em;color:#ddd6fe}
  .stage .mix{width:2.1em;height:2.1em;margin:.65em;flex:none;display:flex;align-items:center;justify-content:center;font-size:1.6em;color:#fde047}
  .stage .lv{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:.3em}
  .lvt{position:relative;background:linear-gradient(180deg,#4a2d86,#24154a);border:.12em solid #d4a64a;border-radius:.6em;color:#fff;cursor:pointer;padding:.25em .15em .3em;font-family:"Fredoka",sans-serif;display:flex;flex-direction:column;align-items:center;min-width:0}
  .lvt b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:1.15em;line-height:1}
  .lvt span{font-size:.62em;color:#ddd6fe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .lvt.locked{filter:grayscale(1) brightness(.55);cursor:not-allowed}
  .lvt.done::after{content:"★";position:absolute;top:0;right:.2em;color:#fde047;font-size:.9em}

<script>
(() => {

/* ---------- save data ---------- */
function loadSave() {

/* ---------- sound ---------- */
let AC = null, soundOn = true, BUS = null;

function ensureAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const master = AC.createGain(), sfx = AC.createGain(), mus = AC.createGain();
      sfx.connect(master); mus.connect(master); master.connect(AC.destination);
      BUS = { master, sfx, mus };
      applyVolumes();
    } catch (err) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
addEventListener('pointerdown', ensureAudio, true);
addEventListener('keydown', ensureAudio, true);
const SFX = () => BUS ? BUS.sfx : AC.destination;
const MUS = () => BUS ? BUS.mus : AC.destination;
const sfxOn = () => AC && !SAVE.allMute && !SAVE.sfxMute && SAVE.sfxVol > 0;
const musOn = () => AC && !SAVE.allMute && !SAVE.musicMute && SAVE.musicVol > 0;
function applyVolumes() {
  if (!BUS) return;
  const t = AC.currentTime;
  BUS.master.gain.setTargetAtTime(SAVE.allMute ? 0 : 1, t, 0.03);
  BUS.sfx.gain.setTargetAtTime(SAVE.sfxMute ? 0 : SAVE.sfxVol, t, 0.03);
  BUS.mus.gain.setTargetAtTime(SAVE.musicMute ? 0 : SAVE.musicVol, t, 0.03);
}
const sndBtn = document.getElementById('snd');
function syncSndBtn() { sndBtn.textContent = SAVE.allMute ? '🔇 Muted' : '🔊 Sound'; sndBtn.classList.toggle('on', SAVE.allMute); }
syncSndBtn();
sndBtn.onclick = (e) => {
  e.stopPropagation(); ensureAudio();
  SAVE.allMute = !SAVE.allMute; persist(); applyVolumes(); syncSndBtn();
  if (!SAVE.allMute) uiPop();
};
function tone(freq, dur = 0.14, type = 'sine', vol = 0.12, delay = 0) {
  if (!sfxOn()) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g).connect(SFX()); o.start(t); o.stop(t + dur + 0.02);
}
const PENT = [0, 2, 4, 7, 9];
function hitNote(n) { const step = PENT[n % 5] + 12 * Math.floor(n / 5); bell(523.25 * Math.pow(2, Math.min(step, 31) / 12), 0.11); }
function chime() { [0, 4, 7, 12].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.3, 'sine', 0.1, i * 0.07)); }
let musicGain = null;
const ODE_A = [[64,1],[64,1],[65,1],[67,1],[67,1],[65,1],[64,1],[62,1],[60,1],[60,1],[62,1],[64,1]];
const ODE = [...ODE_A, [64,1.5],[62,0.5],[62,2], ...ODE_A, [62,1.5],[60,0.5],[60,2],
  [62,1],[62,1],[64,1],[60,1],[62,1],[64,.5],[65,.5],[64,1],[60,1],[62,1],[64,.5],[65,.5],[64,1],[62,1],[60,1],[62,1],[55,2],
  ...ODE_A, [62,1.5],[60,0.5],[60,2]];
const ODE_BASS = [48,43,48,43, 48,43,48,48, 43,48,43,43, 48,43,48,48];
function playOde() {
  // Beethoven's "Ode to Joy" (public domain), synthesised live
  if (!musOn()) return;
  stopMusic();
  const mg = AC.createGain(); mg.gain.value = 0.9; mg.connect(MUS()); musicGain = mg;
  const beat = 0.3, t0 = AC.currentTime + 0.05;
  const note = (m, st, dur, type, vol) => {
    const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
    g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(vol, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + dur * 0.95);
    o.connect(g).connect(mg); o.start(st); o.stop(st + dur);
  };
  let t = t0;
  for (const [m, d] of ODE) { note(m + 12, t, d * beat, 'triangle', 0.13); note(m, t, d * beat, 'square', 0.022); t += d * beat; }
  setTimeout(() => { if (musicGain === mg) musicGain = null; }, (t - AC.currentTime + 0.5) * 1000);
  ODE_BASS.forEach((r, i) => {
    const st = t0 + i * 4 * beat;
    note(r - 12, st, 2 * beat, 'triangle', 0.12); note(r - 5, st + 2 * beat, 2 * beat, 'triangle', 0.09);
    note(r + 4, st, 4 * beat, 'sine', 0.035); note(r + 7, st, 4 * beat, 'sine', 0.03);
    note(36, st, 0.25, 'sine', 0.2);
  });
}
function stopMusic() { if (musicGain && AC) { try { musicGain.gain.setTargetAtTime(0, AC.currentTime, 0.08); } catch (e) {} } musicGain = null; }
function sadTrombone() { [0, -1, -2, -4].forEach((s, i) => tone(233 * Math.pow(2, s / 12), i === 3 ? 0.6 : 0.25, 'sawtooth', 0.04, i * 0.25)); }
/* ---------- layouts ---------- */
const CX = W / 2, CY = 520;
function pt(x, y, extra) { return Object.assign({ x, y }, extra || {}); }
function spaced(pts, min = 26) {

    if (p.x < LEFT - 15 || p.x > RIGHT + 15 || p.y < TOP - 15 || p.y > BOT + 15) continue;
    if (out.every(q => (q.x - p.x) ** 2 + (q.y - p.y) ** 2 >= min * min)) out.push(p);

}
const LAYOUTS = [
  { name: 'Lattice', make() {
    const p = [];

  { name: 'Ripples', make() {
    const p = [];

  }},
  { name: 'Orbits', make() {
    const p = [];
    [[90, 10, 1], [170, 18, -1], [250, 26, 1]].forEach(([rad, n, dir]) => {

        p.push(pt(CX + Math.cos(a) * rad, CY + Math.sin(a) * rad, { orbit: { cx: CX, cy: CY, rad, a, spd: dir * 0.0045 } }));

  { name: 'Chevrons', make() {
    const p = [];
    for (let r = 0; r < 6; r++) {

      for (let x = 62; x <= RIGHT + 10; x += 46) p.push(pt(x, y0 + 0.3 * Math.abs(x - CX)));

  }},
  { name: 'Galaxy', make() {
    const p = [];
    for (let arm = 0; arm < 3; arm++) {

        const rad = 45 + t * 10, a = t * 0.3 + arm * Math.PI * 2 / 3;
        p.push(pt(CX + Math.cos(a) * rad, CY + Math.sin(a) * rad, { orbit: { cx: CX, cy: CY, rad, a, spd: 0.0025 } }));
      }
    }
    for (let y = TOP; y <= BOT; y += 55) for (let x = 65; x <= RIGHT; x += 55) {
      if (Math.hypot(x - CX, y - CY) > 350) p.push(pt(x, y));

  }},
  { name: 'Scatter', make() {
    const p = [];
    for (let i = 0; i < 4000 && p.length < 95; i++) {

      if (p.every(q => (q.x - c.x) ** 2 + (q.y - c.y) ** 2 > 56 * 56)) p.push(c);
    }

  }},
];


const LAYOUT_BY = Object.fromEntries(LAYOUTS.map(l => [l.name, l]));
const MAPS = LAYOUTS.map(l => l.name);

/* ---------- characters, modes ---------- */
const COLORS = {

const POWERS = {

/* ---------- adventure levels (55 original layouts) ---------- */
const TAU = Math.PI * 2, PI = Math.PI;
const SH = {
  ring(cx, cy, r, n, a0 = 0, a1 = TAU) {
    const full = Math.abs(a1 - a0 - TAU) < 1e-6, m = full ? n : Math.max(1, n - 1), o = [];
    for (let k = 0; k < n; k++) { const a = a0 + (a1 - a0) * k / m; o.push(pt(cx + Math.cos(a) * r, cy + Math.sin(a) * r)); }

  ellipse(cx, cy, rx, ry, n, rot = 0) {

    return o;
  },
  line(x0, y0, x1, y1, n) { return Array.from({ length: n }, (_, k) => { const u = n > 1 ? k / (n - 1) : 0.5; return pt(x0 + (x1 - x0) * u, y0 + (y1 - y0) * u); }); },
  path(pts, step = 34) {
    const o = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], n = Math.max(2, Math.round(Math.hypot(x1 - x0, y1 - y0) / step) + 1);
      SH.line(x0, y0, x1, y1, n).slice(i ? 1 : 0).forEach(p => o.push(p));
    }
    return o;
  },
  wave(y, amp, freq, ph = 0, step = 46, x0 = 62, x1 = 738) { const o = []; for (let x = x0; x <= x1; x += step) o.push(pt(x, y + amp * Math.sin(x * freq + ph))); return o; },
  zig(y, amp, period, step = 40) { const o = []; for (let x = 60; x <= 740; x += step) { const u = ((x - 60) / period) % 1; o.push(pt(x, y + amp * (u < 0.5 ? u * 4 - 1 : 3 - u * 4))); } return o; },
  grid(x0, y0, x1, y1, dx, dy, stagger = true) { const o = []; let r = 0; for (let y = y0; y <= y1; y += dy, r++) for (let x = x0 + (stagger && r % 2 ? dx / 2 : 0); x <= x1; x += dx) o.push(pt(x, y)); return o; },
  spiral(cx, cy, r0, r1, turns, n, a0 = 0) { return Array.from({ length: n }, (_, k) => { const u = k / (n - 1), a = a0 + u * turns * TAU, r = r0 + (r1 - r0) * u; return pt(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }); },

const PEG_CACHE = {};

  const S = 4, gw = W / S, gh = H / S, N = gw * gh;
  const oc = document.createElement('canvas'); oc.width = gw; oc.height = gh;
  const c = oc.getContext('2d'); c.scale(1 / S, 1 / S); ART[key](c);
  const d = c.getImageData(0, 0, gw, gh).data;

  let th = 0.5; for (let i = 0; i < N; i++) if (A[i] > th) solidN++;

/* ---------- input ---------- */
function aimAt(clientX, clientY) {
  if (!G) return;
  const r = cv.getBoundingClientRect();
  const mx = (clientX - r.left) / r.width * TW - PX, my = (clientY - r.top) / r.height * TH - PY;
  let a = Math.atan2(my - LY, mx - LX);
  if (my < LY) a = mx < LX ? Math.PI - 0.06 : 0.06;
  G.aimT = Math.max(0.06, Math.min(Math.PI - 0.06, a));
}
cv.addEventListener('pointermove', e => {
  aimAt(e.clientX, e.clientY);
  const r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) / r.width * TW, my = (e.clientY - r.top) / r.height * TH;
  const inField = mx >= PX && mx <= PX + W && my >= PY && my <= PY + H;
  cv.style.cursor = inField && overlay.classList.contains('hidden') ? 'none' : 'default';
});
cv.addEventListener('pointerdown', e => { if (e.button === 0) aimAt(e.clientX, e.clientY); });
let fastHold = false, fastKey = false, fastToggle = false;
const isFast = () => fastHold || fastKey || fastToggle;
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mousedown', e => { if (e.button === 2) fastHold = true; }, true);
addEventListener('mouseup', e => { if (e.button === 2) fastHold = false; }, true);
addEventListener('pointerdown', e => { if (e.button === 2 || (e.buttons & 2)) fastHold = true; }, true);
addEventListener('pointerup', e => { if (e.button === 2 || !(e.buttons & 2)) fastHold = false; }, true);
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') fastHold = !!(e.buttons & 2); }, true);
addEventListener('blur', () => { fastHold = false; fastKey = false; });
const ffBtn = document.getElementById('ff');
ffBtn.onclick = (e) => { e.stopPropagation(); fastToggle = !fastToggle; ffBtn.classList.toggle('on', fastToggle); };
function tryFire(e) { if (performance.now() - justClosed < 250) return; aimAt(e.clientX, e.clientY); fire(); }
// Mouse: use mouseup so a left-click still fires while the right button is held (pointer events merge chorded buttons).
cv.addEventListener('mouseup', e => { if (e.button === 0) tryFire(e); });
cv.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse' && e.button === 0) tryFire(e); });
addEventListener('keyup', e => { if (e.key === 'f' || e.key === 'F') fastKey = false; });
addEventListener('keydown', e => {
  if (!G || (e.target && e.target.tagName === 'INPUT')) return;
  const fine = e.shiftKey ? 0.002 : 0.012;
  if (e.key === 'ArrowLeft') { G.aimT = Math.min(Math.PI - 0.06, (G.aimT ?? G.angle) + fine); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { G.aimT = Math.max(0.06, (G.aimT ?? G.angle) - fine); e.preventDefault(); }
  else if (e.key === 'f' || e.key === 'F') { fastKey = true; }
  else if (e.key === 'Escape') { if (overlay.classList.contains('hidden')) showPause(); }
  else if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (!overlay.classList.contains('hidden')) { const b = card.querySelector('[data-primary]'); if (b) b.click(); }
    else fire();
  }
});

/* ---------- update ---------- */
function update() {
  G.t++;
  let target = 1;
  if (G.feverSlow > 0) { G.feverSlow--; target = 0.25; }
  let zt = 1, zx = G.zfx, zy = G.zfy;
  if (G.feverSlow > 0 && G.feverFocus) { zt = 1.9; zx = G.feverFocus.x; zy = G.feverFocus.y; }
  else if (G.state === 'shot' && !G.fever && orangeLeft() === 1) {
    const last = G.pegs.find(p => p.type === 'orange' && p.alive && !p.hit);
    let b = null, d = 1e9;
    for (const sb of G.shotBalls) { const dd = Math.hypot(sb.x - last.x, sb.y - last.y); if (dd < d) { d = dd; b = sb; } }
    if (b && d < 200) {
      // k: 0 as the ball enters range, 1 when it's right on the peg
      const k = Math.max(0, Math.min(1, (200 - d) / 150)), e = k * k * (3 - 2 * k);
      target = 0.55 - 0.47 * e;                       // down to ~0.08x speed
      zt = 1.35 + 1.15 * e; zx = b.x * 0.4 + last.x * 0.6; zy = b.y * 0.4 + last.y * 0.6;
      G.drama = Math.max(G.drama || 0, e); G.dramaHold = 45; G.dramaFocus = { x: zx, y: zy, z: zt };
      if (G.mood !== 'excited') setMood('excited', 60);
      // heartbeat that speeds up as the ball closes in
      const period = Math.round(34 - 20 * e);
      G.beatT = (G.beatT || 0) + 1;
      if (G.beatT >= period) { G.beatT = 0; tone(55, 0.22, 'sine', 0.28); tone(48, 0.18, 'sine', 0.2, 0.13); shake = Math.max(shake, 2 + 3 * e); }
    } else if (G.dramaHold > 0) {
      // near miss: hang in slow motion for a moment before letting go
      G.dramaHold--; const h = G.dramaHold / 45;
      target = 0.12 + 0.6 * (1 - h); zt = 1 + (G.dramaFocus.z - 1) * h; zx = G.dramaFocus.x; zy = G.dramaFocus.y;
      if (G.dramaHold === 44) tone(110, 0.5, 'triangle', 0.08);
    }
  }
  G.zoom += (zt - G.zoom) * 0.07; G.zfx += (zx - G.zfx) * 0.12; G.zfy += (zy - G.zfy) * 0.12;
  if (G.feverText && --G.feverText.life <= 0) G.feverText = null;
  for (const m of G.styleMsgs) m.life--; G.styleMsgs = G.styleMsgs.filter(m => m.life > 0);
  for (const k in G.bumpFlash) { G.bumpFlash[k] *= 0.88; if (G.bumpFlash[k] < 0.02) delete G.bumpFlash[k]; }
  G.ts += (target - G.ts) * (target < G.ts ? 0.12 : 0.08);
  G.drama = (G.drama || 0) * 0.96;
  const ts = G.ts;

  ctx.save(); ctx.globalAlpha = 0.5; ctx.fillStyle = lg(ctx, 0, PY, 0, PY + 16, [[0, 'rgba(0,0,0,.8)'], [1, 'rgba(0,0,0,0)']]); ctx.fillRect(PX, PY, W, 16); ctx.restore();
  // stone keystone arch that holds the launcher
  const kx = PX + LX;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
  ctx.fillStyle = stoneV(PY - 4, 34); ctx.beginPath(); ctx.moveTo(kx - 92, PY - 4); ctx.lineTo(kx + 92, PY - 4); ctx.quadraticCurveTo(kx + 60, PY + 4, kx + 40, PY + 28); ctx.lineTo(kx - 40, PY + 28); ctx.quadraticCurveTo(kx - 60, PY + 4, kx - 92, PY - 4); ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.lineWidth = 2; ctx.strokeStyle = STONE_DK; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(kx - 80, PY - 2, 160, 1.5);
  [kx - 56, kx + 56].forEach(x => rivet(x, PY + 6));
}
function drawPortraits() {
  if (overlay.classList.contains('hidden')) return;
  card.querySelectorAll('canvas.trophy').forEach(tc => { const c2 = tc.getContext('2d'); c2.clearRect(0, 0, tc.width, tc.height); drawTrophy(c2, tc.width / 2, tc.height * 0.56, tc.width / 300, T); });
  card.querySelectorAll('canvas.portrait').forEach(pc => {
    const c2 = pc.getContext('2d'), w = pc.width, h = pc.height, k = pc.dataset.char, col = POWERS[k].color;
    c2.clearRect(0, 0, w, h);
    c2.fillStyle = rg(c2, w / 2, h / 2, w / 2, [[0, col + '88'], [0.6, col + '22'], [1, col + '00']]); c2.fillRect(0, 0, w, h);
    drawChar(c2, k, w / 2, h * 0.57, w / 135, T, pc.dataset.mood || 'idle');
  });
}

function loop() {
  T++;
  if (G.mode === 'demo' && G.state === 'aim') {
    G.demoWait = (G.demoWait || 0) + 1;
    if (G.demoWait === 1) {
      const pool = G.pegs.filter(p => p.alive && !p.hit && p.type === 'orange');
      const tp = pool[Math.floor(Math.random() * pool.length)] || { x: W / 2, y: 600 };
      G.demoTarget = Math.max(0.1, Math.min(Math.PI - 0.1, Math.atan2(tp.y - LY, tp.x - LX) + (Math.random() - 0.5) * 0.12));
    }
    G.angle += (G.demoTarget - G.angle) * 0.07;
    if (G.demoWait > 65) { G.demoWait = 0; G.balls = Math.max(G.balls, 1); fire(true); }
  }
  if (overlay.classList.contains('hidden') || G.mode === 'demo') {
    const n = isFast() && G.mode !== 'demo' && G.state !== 'shot' ? 6 : 1;
    for (let i = 0; i < n; i++) update();
  }
  draw(); drawPortraits(); musicTick();
  requestAnimationFrame(loop);
}
showMenu();
loop();
})();
</script>
